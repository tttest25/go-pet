name: petar

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: petar_postgres
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 450m
    environment:
      POSTGRES_DB: petar_db
      POSTGRES_USER: petar_user
      POSTGRES_PASSWORD: petar_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-petar.sh:ro
      - ./postgres/migrations:/migrations:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./spool:/spool
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petar_user -d petar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petar_net

  app:
    build:
      context: .
      network: host
    container_name: petar_app
    restart: unless-stopped
    environment:
      DB_DSN: "postgres://petar_user:petar_password@postgres:5432/petar_db?sslmode=disable"
      SPOOL_DIR: "/app/spool"
      HTTP_ADDR: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./spool:/app/spool
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petar_net

networks:
  petar_net:
    name: petar_shared_net
    driver: bridge
