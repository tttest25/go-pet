name: petar

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: petar_postgres
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 450m
    environment:
      POSTGRES_DB: petar_db
      POSTGRES_USER: petar_user
      POSTGRES_PASSWORD: petar_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./spool:/spool
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - petar_net

networks:
  petar_net:
    driver: bridge
